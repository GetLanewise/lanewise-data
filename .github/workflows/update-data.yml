# Haalt elke nacht de flitsers in Nederland op uit OpenStreetMap en commit het
# databestand alleen als er iets veranderd is. Mislukt het ophalen, dan blijft het
# bestand van gisteren gewoon staan en krijg je een mail van GitHub.
name: Flitserdata bijwerken

on:
  schedule:
    - cron: "17 3 * * *" # elke dag om 03:17 UTC
  workflow_dispatch: {} # handmatig starten via het tabblad Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Flitsers ophalen
        run: java tools/FetchCameras.java osm-nl.json

      - name: Committen als er iets veranderd is
        run: |
          if git diff --quiet -- osm-nl.json && git ls-files --error-unmatch osm-nl.json >/dev/null 2>&1; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git config user.name "flitsapp-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add osm-nl.json
          git commit -m "Flitserdata bijgewerkt ($(date -u +%Y-%m-%d))"
          git push
