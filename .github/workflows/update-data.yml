# Haalt elke nacht de flitsers en trajectcontroles in Nederland op uit OpenStreetMap en
# commit de databestanden alleen als er iets veranderd is. Mislukt het ophalen, dan blijft
# het bestand van gisteren gewoon staan en krijg je een mail van GitHub.
name: Flitserdata bijwerken

on:
  schedule:
    - cron: "17 3 * * *" # elke dag om 03:17 UTC
  workflow_dispatch: {} # handmatig starten via het tabblad Actions

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Flitsers ophalen
        run: java tools/FetchCameras.java osm-nl.json

      - name: Trajectcontroles ophalen
        # Los van de flitsers: mislukt dit, dan blijven de flitsers gewoon bijgewerkt.
        continue-on-error: true
        run: java tools/FetchSections.java osm-nl-trajecten.json

      - name: Committen als er iets veranderd is
        run: |
          git add osm-nl.json osm-nl-trajecten.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git config user.name "lanewise-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Flitserdata bijgewerkt ($(date -u +%Y-%m-%d))"
          git push
