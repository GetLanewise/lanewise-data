# Wekelijks: wegenkaart met maximumsnelheden voor de Flitsapp.
# Bron: OpenStreetMap-extract van Nederland (Geofabrik, ODbL). osmium filtert de wegen, FetchRoads
# maakt er een compact binair bestand van. Het bestand komt als release-bestand online (tag "wegen"),
# niet als commit, zodat de repository niet elke week tientallen MB groeit.
name: Wegenkaart bijwerken

on:
  schedule:
    - cron: "40 2 * * 0" # zondag 02:40 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  roads:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: osmium installeren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Nederland downloaden (Geofabrik)
        run: |
          for url in https://download.geofabrik.de/europe/netherlands-latest.osm.pbf https://download.openstreetmap.fr/extracts/europe/netherlands-latest.osm.pbf; do
            if curl -sSfL --retry 5 --retry-delay 30 --retry-all-errors -A "flitsapp-data/1 (wekelijks)" -o nl.osm.pbf "$url"; then echo "Gedownload van $url"; break; fi
          done
          test -s nl.osm.pbf
          ls -la nl.osm.pbf

      - name: Wegen eruit filteren
        run: |
          osmium tags-filter nl.osm.pbf w/highway=motorway,trunk,primary,secondary,tertiary,unclassified,residential,living_street,road,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link -o wegen.osm.pbf
          osmium export wegen.osm.pbf -f geojsonseq --geometry-types=linestring -a id -o wegen.geojsonseq
          ls -la wegen.geojsonseq

      - name: Wegenbestand maken
        run: java -Xmx6g tools/FetchRoads.java osm-nl-wegen.bin.gz --geojsonseq wegen.geojsonseq

      - name: Spoorwegovergangen
        run: |
          osmium tags-filter nl.osm.pbf n/railway=level_crossing -o overwegen.osm.pbf
          osmium export overwegen.osm.pbf -f geojsonseq --geometry-types=point -o overwegen.geojsonseq
          java tools/FetchRoads.java osm-nl-overwegen.json.gz --crossings overwegen.geojsonseq

      - name: Publiceren als release-bestand
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view wegen >/dev/null 2>&1 || gh release create wegen --title "Wegenkaart (maximumsnelheden)" --notes "Wekelijks bijgewerkt uit OpenStreetMap (© OpenStreetMap-bijdragers, ODbL). Gebruikt door de Flitsapp."
          gh release upload wegen osm-nl-wegen.bin.gz osm-nl-overwegen.json.gz --clobber

      - name: Matrixborden (NDW, CC0) - aparte release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          java tools/FetchMsi.java ndw-msi-locaties.json.gz
          gh release view matrixborden >/dev/null 2>&1 || gh release create matrixborden --title "Matrixborden (locaties)" --notes "Locaties van de matrixborden boven de snelwegen, wekelijks uit de NDW-shapefile (open data, CC0). Gebruikt door Lanewise om te zeggen welke rijstrook dicht is."
          gh release upload matrixborden ndw-msi-locaties.json.gz --clobber
